[providers]
node = true

[phases.setup]
nixPkgs = ["ffmpeg-full", "fontconfig", "coreutils", "dejavu_fonts", "liberation_ttf"]
aptPkgs = []

[phases.install]
cmds = [
  "cd server && npm install",
  "mkdir -p $HOME/.local/share/fonts",
  "cp server/assets/fonts/*.ttf $HOME/.local/share/fonts/ 2>/dev/null; true",
  "fc-cache -fv || true"
]

[start]
cmd = "cd server && node server.js"
