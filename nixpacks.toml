[providers]
node = true

[phases.setup]
nixPkgs = ["ffmpeg", "fontconfig", "coreutils"]
aptPkgs = ["fonts-liberation", "fonts-dejavu", "fonts-noto"]

[phases.install]
cmds = [
  "cd server && npm install",
  "mkdir -p /usr/share/fonts/truetype/custom",
  "cp server/assets/fonts/*.ttf /usr/share/fonts/truetype/custom/ || true",
  "fc-cache -fv"
]

[start]
cmd = "cd server && node server.js"
