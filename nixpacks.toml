[providers]
node = true

[phases.setup]
nixPkgs = ["fontconfig", "coreutils"]
aptPkgs = ["ffmpeg", "fonts-liberation", "fonts-dejavu", "fonts-noto"]

[phases.install]
cmds = [
  "cd server && npm install",
  "mkdir -p $HOME/.local/share/fonts",
  "cp server/assets/fonts/*.ttf $HOME/.local/share/fonts/ 2>/dev/null; true",
  "fc-cache -fv || true"
]

[start]
cmd = "cd server && node server.js"
