<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NeuroGen Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 500px; height: 340px;
    background: transparent;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    -webkit-app-region: drag;
  }
  .splash {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #0a0a0f 0%, #111120 40%, #0d0d1f 100%);
    border-radius: 20px;
    border: 1px solid rgba(139,92,246,0.3);
    box-shadow: 0 0 60px rgba(139,92,246,0.25), 0 30px 80px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    position: relative;
    overflow: hidden;
  }
  .splash::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(from 0deg, transparent 0%, rgba(139,92,246,0.04) 30%, transparent 60%);
    animation: spin 8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .logo-ring {
    position: relative;
    width: 80px; height: 80px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-ring::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #8b5cf6;
    border-right-color: #6366f1;
    animation: spin 1.2s linear infinite;
  }
  .logo-inner {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    box-shadow: 0 0 30px rgba(139,92,246,0.5);
  }
  .title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #fff 0%, #c4b5fd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.3px;
  }
  .dots {
    display: flex; gap: 8px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #8b5cf6;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; background: #6366f1; }
  .dot:nth-child(3) { animation-delay: 0.4s; background: #a78bfa; }
  @keyframes bounce {
    0%, 100% { opacity: 0.3; transform: scale(0.7); }
    50% { opacity: 1; transform: scale(1); }
  }
  .version {
    position: absolute;
    bottom: 18px;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="splash">
  <div class="logo-ring">
    <div class="logo-inner">✦</div>
  </div>
  <div>
    <div class="title">NeuroGen Studio</div>
    <div class="subtitle" style="text-align:center;margin-top:4px">AI Video Generation Platform</div>
  </div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div class="version">v1.0.0 DESKTOP</div>
</div>
</body>
</html>
